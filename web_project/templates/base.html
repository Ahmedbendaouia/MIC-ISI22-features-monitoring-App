{% load static %}
<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- Tell the browser to be responsive to screen width -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="keywords"
      content="wrappixel, admin dashboard, html css dashboard, web dashboard, bootstrap 5 admin, bootstrap 5, css3 dashboard, bootstrap 5 dashboard, Ample lite admin bootstrap 5 dashboard, frontend, responsive bootstrap 5 admin template, Ample admin lite dashboard bootstrap 5 dashboard template"
    />
    <meta
      name="description"
      content="Ample Admin Lite is powerful and clean admin dashboard template, inpired from Bootstrap Framework"
    />
    <meta name="robots" content="noindex,nofollow" />    
    <link
      rel="canonical"
      href="https://www.wrappixel.com/templates/ample-admin-lite/"
    />
    <!-- Favicon icon -->
    <link
      rel="icon"
      type="image/png"
      sizes="auto"
      href="{% static 'plugins/images/logos/logo.png' %}"
    />
    <!-- Custom CSS -->
    <link
      href="{% static 'plugins/bower_components/chartist/dist/chartist.min.css' %}"
      rel="stylesheet"
    />    
    <!-- Custom CSS -->
    <link href="{% static 'css/style.min.css'%}" rel="stylesheet" />
  </head>

  <body>
    <!-- Preloader - style you can find in spinners.css -->

    <div class="preloader">
      <div class="lds-ripple">
        <div class="lds-pos"></div>
        <div class="lds-pos"></div>
      </div>
    </div>

    <!-- Main wrapper - style you can find in pages.scss -->

    <div
      id="main-wrapper"
      data-layout="vertical"
      data-navbarbg="skin5"
      data-sidebartype="full"
      data-sidebar-position="absolute"
      data-header-position="absolute"
      data-boxed-layout="full"
    >
      <!-- Topbar header - style you can find in pages.scss -->

      <header class="topbar" data-navbarbg="skin5">
        <nav class="navbar top-navbar navbar-expand-md navbar-dark">
          <div class="navbar-header" data-logobg="skin6">
            <!-- Logo -->

            <a class="navbar-brand" href="/">
              <!-- Logo icon -->
              <b class="logo-icon">
                <!-- Dark Logo icon -->
                <img
                  src="{% static 'plugins/images/logos/logo.png'%}"
                  width="60"
                  height="60"
                  alt="homepage"
                />
              </b>
              <!--End Logo icon -->
              <!-- Logo text -->
              <span class="logo-text">
                <!-- dark Logo text -->
                <img
                  src="{% static 'plugins/images/logos/new_reminex.png'%}"
                  width="150"
                  height="70"
                  alt="homepage"
                />
              </span>
            </a>

            <!-- End Logo -->

            <!-- toggle and nav items -->

            <a
              class="nav-toggler waves-effect waves-light text-dark d-block d-md-none"
              href="javascript:void(0)"
              ><i class="ti-menu ti-close"></i
            ></a>
          </div>

          <!-- End Logo -->

          <div
            class="navbar-collapse collapse"
            id="navbarSupportedContent"
            data-navbarbg="skin5"
          >
            <!-- Right side toggle and nav items -->

            <ul class="navbar-nav ms-auto d-flex align-items-center">
              <!-- Search -->

              <li class="in">
                <form role="search" class="app-search d-none d-md-block me-3">
                  <input
                    type="text"
                    placeholder="Search..."
                    class="form-control mt-0"
                  />
                  <a href="" class="active">
                    <i class="fa fa-search"></i>
                  </a>
                </form>
              </li>

              <!-- User profile and search -->

              <li>
                <a class="profile-pic" href="#">
                  <img
                    src="{% static 'plugins/images/users/d1.jpg'%}"
                    alt="user-img"
                    width="36"
                    class="img-circle"
                  /><span class="text-white font-medium"
                    >{{request.user}}</span
                  ></a
                >
              </li>
              <li>
                <a class="profile-pic" href="{% url 'logout' %}">
                  <span class="text-white font-medium">logout</span></a
                >
              </li>
            </ul>
          </div>
        </nav>
      </header>

      <!-- End Topbar header -->

      <!-- Left Sidebar - style you can find in sidebar.scss  -->

      <aside class="left-sidebar" data-sidebarbg="skin6">
        <!-- Sidebar scroll-->
        <div class="scroll-sidebar">
          <!-- Sidebar navigation-->
          <nav class="sidebar-nav">
            <ul id="sidebarnav">
              <!-- User Profile-->
              <li class="sidebar-item pt-2">
                <a
                  class="sidebar-link waves-effect waves-dark sidebar-link"
                  href="/video_detection/Flotation_froth/"
                  aria-expanded="false"
                >
                  <i class="fas fa-file-video" aria-hidden="true"></i>
                  <span class="hide-menu">Flotation froth display</span>
                </a>
              </li>

              <li class="sidebar-item">
                <a
                  class="sidebar-link waves-effect waves-dark sidebar-link"
                  href="/video_detection/Bubble_monitoring/"
                  aria-expanded="false"
                >
                  <i class="fas fa-file-image" aria-hidden="true"></i>
                  <span class="hide-menu">Bubble size monitoring</span>
                </a>
              </li>
            </ul>
          </nav>
          <!-- End Sidebar navigation -->
        </div>
        <!-- End Sidebar scroll-->
      </aside>
      <!-- End Left Sidebar - style you can find in sidebar.scss  -->

      <!-- Page wrapper  -->
      <div class="page-wrapper">
        <!-- Bread crumb and right sidebar toggle -->
        <!-- End Bread crumb and right sidebar toggle -->
        <!-- Container fluid  -->
        <div class="container-fluid">{% block content %}{% endblock %}</div>
        <!-- End Container fluid  -->
        <!-- footer -->
        <footer class="footer text-center">
          Copyright &copy; Master ISI 2022/2023 [belcaid - Sadqi]
        </footer>
        <!-- End footer -->
      </div>
      <!-- End Page wrapper  -->
    </div>

    <!-- End Wrapper -->

    <!-- All Jquery -->

    <script src="{% static 'plugins/bower_components/jquery/dist/jquery.min.js'%}"></script>
    <!-- Bootstrap tether Core JavaScript -->
    <script src="{% static 'bootstrap/dist/js/bootstrap.bundle.min.js'%}"></script>
    <script src="{% static 'js/app-style-switcher.js'%}"></script>
    <!--<script src="{% static 'plugins/bower_components/jquery-sparkline/jquery.sparkline.min.js'%}"></script>-->
    <!--Wave Effects -->
    <script src="{% static 'js/waves.js'%}"></script>
    <!--Menu sidebar -->
    <script src="{% static 'js/sidebarmenu.js'%}"></script>
    <!--Custom JavaScript -->
    <script src="{% static 'js/custom.js'%}"></script>
    <!--This page JavaScript -->
    <!--chartis chart-->
    <!--<script src="{% static 'js/chart.js'%}"></script>
    <script src="{% static 'js/chart_image_proccess.js'%}"></script>
    -->
    <!--<script src="{% static 'plugins/bower_components/chartist/dist/chartist.min.js'%}"></script>
    <script src="{% static 'plugins/bower_components/chartist-plugin-tooltips/dist/chartist-plugin-tooltip.min.js'%} "></script>-->
    <script src="{% static 'js/pages/dashboards/dashboard1.js' %} "></script>
  </body>
</html>
