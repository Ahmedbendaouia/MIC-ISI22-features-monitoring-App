{% extends 'base.html' %} {% block content %}



<!-- Three charts -->
<div class="row justify-content-center">
    <div class="col-lg-4 col-md-12">

        <div class="shadow-lg p-3 mb-5 bg-white rounded">
            <h3 class="box-title">flotation froth</h3>
            <img src="{% url 'flotation_froth_frame'  %}" width="300" height="200" title="flotation froth" allowfullscreen/>
        </div>

    </div>
    <div class="col-lg-4 col-md-12">
        <div class="shadow-lg p-3 mb-5 bg-white rounded">
            <h3 class="box-title">Otsu thresholding</h3>
           <img src=" {% url 'Otsu_frame'  %}" width="300" height="200" title="Otsu thresholding" allowfullscreen/>
        </div>
    </div>
    <div class="col-lg-4 col-md-12">
        <div class="shadow-lg p-3 mb-5 bg-white rounded">
            <h3 class="box-title">Sparse optical flow.</h3>
            <img src="{% url 'spare_frame'  %}" width="300" height="200" title="Sparse optical flow" allowfullscreen/>
        </div>
    </div>

<div class="row">
    <div id="chartContainer" style="height: 300px; width: 100%;"></div>
</div>
<br>



</div>
<!-- la mousse  -->
<div class="row">
    <div class="col-md-12 col-lg-12 col-sm-12 col-xs-12">
        <div class="white-box">
            <h3 class="box-title">La mousse  </h3>
            <div class="d-md-flex">
                <ul class="list-inline d-flex ms-auto">
                    <li class="ps-3">
                        <h5><i class="fa fa-circle me-1 text-info"></i>VX</h5>
                    </li>
                    <li class="ps-3">
                        <h5><i class="fa fa-circle me-1 text-inverse"></i>VY</h5>
                    </li>
                </ul>
            </div>
            <div id="ct-visits" style="height: 405px;">
                <div class="chartist-tooltip" style="top: -17px; left: -12px;"><span class="chartist-tooltip-value">6</span>
                </div>
            </div>
        </div>
    </div>

</div>
</div>
</div>



<script>

    window.onload = function () {
        var dataPoints = [{y : 10}, {y : 13}, {y : 18}, {y : 20}, {y : 17}];
        var dataPoints2 = [{y : 7}, {y : 20}, {y : 10}, {y : 5}, {y : 19}];
        var dataPoints3 = [{y : 15}, {y : 10}, {y : 13}, {y : 10}, {y : 5}];
    
        var chart = new CanvasJS.Chart("chartContainer", {
        theme:"light2",
        animationEnabled: true,
        title:{
            text: "Analyse de vitesse"
        },
        axisY :{
            title: "valeurs",
            suffix: "m/s"
        },
        toolTip: {
            shared: "true"
        },
        legend:{
            cursor:"pointer",
            itemclick : toggleDataSeries
        },
        data: [{
            type: "spline",
            
            showInLegend: true,
            yValueFormatString: "##.00m/s",
            name: "VX",
            dataPoints: dataPoints 
                        
        },
        {
            type: "spline", 
            showInLegend: true,
            
            yValueFormatString: "##.00m/s",
            name: "VY",
            dataPoints: dataPoints2 
        },
        {
            type: "spline",		
            showInLegend: true,
            yValueFormatString: "##.00m/s",
            name: "V",
            dataPoints: dataPoints3
        }]
    });
    chart.render();
    
    var yVal = 15;
    var yVal2 = 18;
    var yVal3 = 10;
    
        var updateChart = function (xmlhttp) {
    
            yVal = yVal + Math.round(5 + Math.random() * (-5 - 5));
            yVal2 = yVal2 + Math.round(5 + Math.random() * (-5 - 5));
            yVal3 = yVal3 + Math.round(5 + Math.random() * (-5 - 5));      	
            
            dataPoints.push({
                y : yVal
            });
            dataPoints2.push({
                y : yVal2
            });
            dataPoints3.push({
                y : yVal3
            });
    
              
            
            chart.render();    
            
        };
        setInterval(function(){updateChart()}, 1000);
    
    function toggleDataSeries(e) {
        if (typeof(e.dataSeries.visible) === "undefined" || e.dataSeries.visible ){
            e.dataSeries.visible = false;
        } else {
            e.dataSeries.visible = true;
        }
        chart.render();
    }
    
    url = '{% url "test_stream" %}';
    let xmlhttp = new XMLHttpRequest();
    xmlhttp.open("get", url, true);
    xmlhttp.send();
    
    
    function handleEvent(e) {
        
        console.log(e.target.responseText);
        
    }
    
    xmlhttp.addEventListener('progress',handleEvent);
    
    }
    
    
        </script>

<!-- End Container fluid  -->

<script src="https://canvasjs.com/assets/script/canvasjs.min.js"></script>


{% endblock %}
